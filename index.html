<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cutter Tool – Multi‑Shape + Manual + Step & Repeat + Delete</title>

<style>
body {
  margin: 0;
  background: #111;
  color: #eee;
  font-family: sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#side {
  width: 100%;
  height: 50vh;
  background: #1a1a1a;
  box-sizing: border-box;
  border-bottom: 2px solid #333;
  font-size: 110%;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
#sideScroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 20px;
}
#side h3 {
  margin: 16px 0 8px;
  color: #d6d600;
  font-size: 130%;
}
#side h4 {
  margin: 10px 0 4px;
  color: #ccc;
}
#side label {
  display: block;
  margin-top: 6px;
}
#side input, #side select {
  width: 160px;
  padding: 6px;
  margin: 4px 0;
  background: #000;
  color: #eee;
  border: 1px solid #444;
  font-size: 100%;
}
#side button {
  padding: 10px;
  margin: 6px 4px 0 0;
  background: #333;
  color: #eee;
  border: 1px solid #555;
  font-size: 100%;
  cursor: pointer;
}
#side button:hover {
  border-color: #d6d600;
  color: #d6d600;
}
#modeButtons button {
  width: 48%;
}
#exportButtons button {
  width: 48%;
}
#c {
  flex: 1;
  width: 100%;
  height: 100%;
  background: #222;
  display: block;
  min-width: 0;
  min-height: 0;
}
@media (min-width: 900px) {
  body { flex-direction: row; }
  #side {
    width: 380px;
    height: 100vh;
    max-height: none;
    border-bottom: none;
    border-right: 2px solid #333;
  }
}
#exportFloat {
  position: fixed;
  bottom: 18px;
  right: 18px;
  display: flex;
  gap: 10px;
  z-index: 9999;
}
#exportFloat button {
  padding: 13px 22px;
  background: #1a1a00;
  color: #d6d600;
  border: 2px solid #d6d600;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  border-radius: 5px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.7);
  font-family: sans-serif;
}
#exportFloat button:hover {
  background: #d6d600;
  color: #111;
}
.selectedLabel {
  color: #d6d600;
  font-weight: bold;
}
</style>
</head>
<body>

<div id="side">
  <div id="sideScroll">
  <h3>Mode</h3>
  <div id="modeButtons">
    <button id="modeAuto" class="selectedLabel">Auto Layout</button>
    <button id="modeManual">Manual Placement</button>
  </div>

  <h3>Outer Profile</h3>
  <label>Shape
    <select id="profileShape">
      <option value="rect">Rectangle</option>
      <option value="circle">Circle</option>
      <option value="oval">Oval</option>
    </select>
  </label>

  <div id="profileRectInputs">
    <label>Width (mm) <input id="mw" type="number" value="100"></label>
    <label>Height (mm) <input id="mh" type="number" value="100"></label>
    <label>All Corners (mm) <input id="cr" type="number" value="2" placeholder="sets all 4"></label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:4px;">
      <label style="margin:0">↖ TL (mm)<input id="crTL" type="number" value="2" style="width:100%"></label>
      <label style="margin:0">↗ TR (mm)<input id="crTR" type="number" value="2" style="width:100%"></label>
      <label style="margin:0">↙ BL (mm)<input id="crBL" type="number" value="2" style="width:100%"></label>
      <label style="margin:0">↘ BR (mm)<input id="crBR" type="number" value="2" style="width:100%"></label>
    </div>
  </div>

  <div id="profileCircleInputs" style="display:none;">
    <label>Diameter (mm) <input id="pDiam" type="number" value="100"></label>
  </div>

  <div id="profileOvalInputs" style="display:none;">
    <label>Width (mm) <input id="pOw" type="number" value="120"></label>
    <label>Height (mm) <input id="pOh" type="number" value="80"></label>
  </div>

  <h3>Inner Shape</h3>
  <label>Shape
    <select id="innerShapeType">
      <option value="rect">Rectangle</option>
      <option value="circle">Circle</option>
      <option value="oval">Oval</option>
      <option value="dash">Dashed Line</option>
    </select>
  </label>

  <div id="innerRectInputs">
    <label>Width (mm) <input id="bw" type="number" value="50"></label>
    <label>Height (mm) <input id="bh" type="number" value="20"></label>
  </div>

  <div id="innerCircleInputs" style="display:none;">
    <label>Diameter (mm) <input id="bDiam" type="number" value="30"></label>
  </div>

  <div id="innerOvalInputs" style="display:none;">
    <label>Width (mm) <input id="bOw" type="number" value="40"></label>
    <label>Height (mm) <input id="bOh" type="number" value="25"></label>
  </div>

  <div id="innerDashInputs" style="display:none;">
    <label>Length (mm) <input id="bDashLen" type="number" value="40"></label>
    <label>Orientation
      <select id="bDashOrient">
        <option value="h">Horizontal</option>
        <option value="v">Vertical</option>
      </select>
    </label>
    <label>Cut Length (mm) <input id="bDashCut" type="number" value="3" step="0.5"></label>
    <label>Tie Length (mm) <input id="bDashTie" type="number" value="1" step="0.5"></label>
  </div>

  <h4>Step & Repeat (optional)</h4>
  <label>Start X (mm) <input id="srStartX" type="number" value="0"></label>
  <label>Start Y (mm) <input id="srStartY" type="number" value="0"></label>
  <label>Columns <input id="srCols" type="number" value="1"></label>
  <label>Rows <input id="srRows" type="number" value="1"></label>
  <label>H‑Spacing (mm) <input id="srHSpace" type="number" value="0"></label>
  <label>V‑Spacing (mm) <input id="srVSpace" type="number" value="0"></label>

  <button id="add">Add Shape(s)</button>
  <button id="lay">Auto Layout</button>
  <button id="clr">Clear All</button>

  <h3>Selected Shape (Manual Mode)</h3>
  <div id="manualPanel" style="opacity:0.4; pointer-events:none;">
    <label>Type: <span id="selType">–</span></label>
    <label>X (mm) <input id="selX" type="number"></label>
    <label>Y (mm) <input id="selY" type="number"></label>
    <label id="selWLabel">Width (mm) <input id="selW" type="number"></label>
    <label id="selHLabel">Height (mm) <input id="selH" type="number"></label>
    <label id="selDLabel" style="display:none;">Diameter (mm) <input id="selD" type="number"></label>

    <div id="selCornerPanel" style="display:none;">
      <h4>Corner Radii (mm)</h4>
      <label>All Corners <input id="selCrAll" type="number" value="0" placeholder="sets all 4"></label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:4px;">
        <label style="margin:0">↖ TL<input id="selCrTL" type="number" value="0" style="width:100%"></label>
        <label style="margin:0">↗ TR<input id="selCrTR" type="number" value="0" style="width:100%"></label>
        <label style="margin:0">↙ BL<input id="selCrBL" type="number" value="0" style="width:100%"></label>
        <label style="margin:0">↘ BR<input id="selCrBR" type="number" value="0" style="width:100%"></label>
      </div>
    </div>

    <div id="selDashPanel" style="display:none;">
      <h4>Dashed Line</h4>
      <label>Length (mm) <input id="selDashLen" type="number"></label>
      <label>Orientation
        <select id="selDashOrient">
          <option value="h">Horizontal</option>
          <option value="v">Vertical</option>
        </select>
      </label>
      <label>Cut Length (mm) <input id="selDashCut" type="number" step="0.5"></label>
      <label>Tie Length (mm) <input id="selDashTie" type="number" step="0.5"></label>
    </div>

    <h4>Spacing / Duplication</h4>
    <label>Horizontal Spacing (mm) <input id="spH" type="number" value="5"></label>
    <label>Vertical Spacing (mm) <input id="spV" type="number" value="0"></label>
    <label>Copies <input id="spN" type="number" value="3"></label>
    <button id="dup">Duplicate</button>

    <h4>Snap</h4>
    <button id="snapL">Snap Left</button>
    <button id="snapR">Snap Right</button>
    <button id="snapT">Snap Top</button>
    <button id="snapB">Snap Bottom</button>
    <button id="snapCH">Center H</button>
    <button id="snapCV">Center V</button>

    <h4>Delete</h4>
    <button id="delSel">Delete Selected</button>
  </div>

  </div><!-- /sideScroll -->
</div>

<div id="exportFloat">
  <button id="downloadSvg">⬇ SVG</button>
  <button id="downloadPdf">⬇ PDF</button>
  <button id="downloadPdfAnnotated">⬇ PDF + Dims</button>
</div>

<canvas id="c"></canvas>


<script>
let S = {
  profileType: "rect",
  mw: 100,
  mh: 100,
  cr: 2,
  profileR: { tl: 2, tr: 2, br: 2, bl: 2 },
  boxes: [],
  placed: [],
  scale: 1,
  pad: 20,
  mode: "auto",
};

const c = document.getElementById("c");
const x = c.getContext("2d");
let lastSvg = "";
let selectedIndex = -1;

/* UI elements */
const profileShape = document.getElementById("profileShape");
const profileRectInputs = document.getElementById("profileRectInputs");
const profileCircleInputs = document.getElementById("profileCircleInputs");
const profileOvalInputs = document.getElementById("profileOvalInputs");
const mw = document.getElementById("mw");
const mh = document.getElementById("mh");
const cr = document.getElementById("cr");
const crTL = document.getElementById("crTL");
const crTR = document.getElementById("crTR");
const crBR = document.getElementById("crBR");
const crBL = document.getElementById("crBL");
const pDiam = document.getElementById("pDiam");
const pOw = document.getElementById("pOw");
const pOh = document.getElementById("pOh");

const innerShapeType = document.getElementById("innerShapeType");
const innerRectInputs = document.getElementById("innerRectInputs");
const innerCircleInputs = document.getElementById("innerCircleInputs");
const innerOvalInputs = document.getElementById("innerOvalInputs");
const bw = document.getElementById("bw");
const bh = document.getElementById("bh");
const bDiam = document.getElementById("bDiam");
const bOw = document.getElementById("bOw");
const bOh = document.getElementById("bOh");

const srStartX = document.getElementById("srStartX");
const srStartY = document.getElementById("srStartY");
const srCols = document.getElementById("srCols");
const srRows = document.getElementById("srRows");
const srHSpace = document.getElementById("srHSpace");
const srVSpace = document.getElementById("srVSpace");

const modeAuto = document.getElementById("modeAuto");
const modeManual = document.getElementById("modeManual");
const manualPanel = document.getElementById("manualPanel");

const selType = document.getElementById("selType");
const selX = document.getElementById("selX");
const selY = document.getElementById("selY");
const selW = document.getElementById("selW");
const selH = document.getElementById("selH");
const selD = document.getElementById("selD");
const selWLabel = document.getElementById("selWLabel");
const selHLabel = document.getElementById("selHLabel");
const selDLabel = document.getElementById("selDLabel");

const spH = document.getElementById("spH");
const spV = document.getElementById("spV");
const spN = document.getElementById("spN");

/* Resize canvas */
function rs() {
  c.width = c.clientWidth;
  c.height = c.clientHeight;
  S.scale = Math.min(
    (c.width - 2 * S.pad) / S.mw,
    (c.height - 2 * S.pad) / S.mh
  );
  dr();
}
window.onresize = rs;

function mm(n) { return n * S.scale; }

/* Mode switching */
function setMode(mode) {
  S.mode = mode;
  if (mode === "auto") {
    modeAuto.classList.add("selectedLabel");
    modeManual.classList.remove("selectedLabel");
    manualPanel.style.opacity = 0.4;
    manualPanel.style.pointerEvents = "none";
    document.getElementById("lay").disabled = false;
  } else {
    modeManual.classList.add("selectedLabel");
    modeAuto.classList.remove("selectedLabel");
    manualPanel.style.opacity = 1;
    manualPanel.style.pointerEvents = "auto";
    document.getElementById("lay").disabled = true;
  }
  selectedIndex = -1;
  updateSelectedUI();
  dr();
}

modeAuto.onclick = () => setMode("auto");
modeManual.onclick = () => setMode("manual");

/* Profile shape change */
profileShape.onchange = () => {
  S.profileType = profileShape.value;
  profileRectInputs.style.display = (S.profileType === "rect") ? "block" : "none";
  profileCircleInputs.style.display = (S.profileType === "circle") ? "block" : "none";
  profileOvalInputs.style.display = (S.profileType === "oval") ? "block" : "none";

  if (S.profileType === "rect") {
    S.mw = parseFloat(mw.value) || 100;
    S.mh = parseFloat(mh.value) || 100;
  } else if (S.profileType === "circle") {
    const d = parseFloat(pDiam.value) || 100;
    S.mw = d;
    S.mh = d;
  } else if (S.profileType === "oval") {
    S.mw = parseFloat(pOw.value) || 120;
    S.mh = parseFloat(pOh.value) || 80;
  }
  if (S.mode === "auto") layout();
  rs();
};

mw.onchange = () => {
  if (S.profileType === "rect") {
    S.mw = parseFloat(mw.value) || 100;
    if (S.mode === "auto") layout();
    rs();
  }
};
mh.onchange = () => {
  if (S.profileType === "rect") {
    S.mh = parseFloat(mh.value) || 100;
    if (S.mode === "auto") layout();
    rs();
  }
};
cr.onchange = () => {
  const v = parseFloat(cr.value) || 0;
  S.cr = v;
  S.profileR = { tl: v, tr: v, br: v, bl: v };
  crTL.value = v; crTR.value = v; crBR.value = v; crBL.value = v;
  if (S.mode === "auto") layout();
  dr();
};
function profileCornerChange() {
  S.profileR.tl = parseFloat(crTL.value) || 0;
  S.profileR.tr = parseFloat(crTR.value) || 0;
  S.profileR.br = parseFloat(crBR.value) || 0;
  S.profileR.bl = parseFloat(crBL.value) || 0;
  // Keep S.cr as max for legacy cornerR auto-layout usage
  S.cr = Math.max(S.profileR.tl, S.profileR.tr, S.profileR.br, S.profileR.bl);
  if (S.mode === "auto") layout();
  dr();
}
crTL.onchange = profileCornerChange;
crTR.onchange = profileCornerChange;
crBR.onchange = profileCornerChange;
crBL.onchange = profileCornerChange;
pDiam.onchange = () => {
  if (S.profileType === "circle") {
    const d = parseFloat(pDiam.value) || 100;
    S.mw = d;
    S.mh = d;
    if (S.mode === "auto") layout();
    rs();
  }
};
pOw.onchange = () => {
  if (S.profileType === "oval") {
    S.mw = parseFloat(pOw.value) || 120;
    if (S.mode === "auto") layout();
    rs();
  }
};
pOh.onchange = () => {
  if (S.profileType === "oval") {
    S.mh = parseFloat(pOh.value) || 80;
    if (S.mode === "auto") layout();
    rs();
  }
};

/* Inner shape type change */
innerShapeType.onchange = () => {
  const t = innerShapeType.value;
  innerRectInputs.style.display = (t === "rect") ? "block" : "none";
  innerCircleInputs.style.display = (t === "circle") ? "block" : "none";
  innerOvalInputs.style.display = (t === "oval") ? "block" : "none";
  document.getElementById("innerDashInputs").style.display = (t === "dash") ? "block" : "none";
};

/* Add shape(s) with Step & Repeat */
document.getElementById("add").onclick = () => {
  const t = innerShapeType.value;
  let w, h;

  if (t === "rect") {
    w = parseFloat(bw.value);
    h = parseFloat(bh.value);
  } else if (t === "circle") {
    const d = parseFloat(bDiam.value);
    w = d; h = d;
  } else if (t === "oval") {
    w = parseFloat(bOw.value);
    h = parseFloat(bOh.value);
  } else if (t === "dash") {
    const len = parseFloat(document.getElementById("bDashLen").value) || 40;
    const orient = document.getElementById("bDashOrient").value;
    const cut = parseFloat(document.getElementById("bDashCut").value) || 3;
    const tie = parseFloat(document.getElementById("bDashTie").value) || 1;
    // bounding box: 0 height for h, 0 width for v (use 0.5mm as token height/width for layout)
    w = orient === "h" ? len : 0.5;
    h = orient === "v" ? len : 0.5;

    const cols = Math.max(1, parseInt(srCols.value) || 1);
    const rows = Math.max(1, parseInt(srRows.value) || 1);
    const startX = parseFloat(srStartX.value) || 0;
    const startY = parseFloat(srStartY.value) || 0;
    const hSpace = parseFloat(srHSpace.value) || 0;
    const vSpace = parseFloat(srVSpace.value) || 0;

    for (let rIdx = 0; rIdx < rows; rIdx++) {
      for (let cIdx = 0; cIdx < cols; cIdx++) {
        const xPos = startX + cIdx * (w + hSpace);
        const yPos = startY + rIdx * (h + vSpace);
        const box = { type: "dash", w, h, orient, cut, tie };
        S.boxes.push(box);
        if (S.mode === "manual") {
          S.placed.push({ ...box, x: xPos, y: yPos });
        }
      }
    }
    if (S.mode === "auto") layout();
    dr();
    return;
  } else {
    w = parseFloat(bOw.value);
    h = parseFloat(bOh.value);
  }
  if (!w || !h) return;

  const cols = Math.max(1, parseInt(srCols.value) || 1);
  const rows = Math.max(1, parseInt(srRows.value) || 1);
  const startX = parseFloat(srStartX.value) || 0;
  const startY = parseFloat(srStartY.value) || 0;
  const hSpace = parseFloat(srHSpace.value) || 0;
  const vSpace = parseFloat(srVSpace.value) || 0;

  for (let rIdx = 0; rIdx < rows; rIdx++) {
    for (let cIdx = 0; cIdx < cols; cIdx++) {
      const xPos = startX + cIdx * (w + hSpace);
      const yPos = startY + rIdx * (h + vSpace);

      const box = { type: t, w, h };
      if (t === "rect") box.r = { tl: 0, tr: 0, br: 0, bl: 0 };
      S.boxes.push(box);

      if (S.mode === "manual") {
        S.placed.push({
          ...box,
          x: xPos,
          y: yPos
        });
      }
    }
  }

  if (S.mode === "auto") {
    layout();
  }
  dr();
};

/* Clear all */
document.getElementById("clr").onclick = () => {
  S.boxes = [];
  S.placed = [];
  selectedIndex = -1;
  updateSelectedUI();
  dr();
};

/* Overlap check */
function ov(a, b) {
  return !(
    a.x + a.w <= b.x ||
    b.x + b.w <= a.x ||
    a.y + a.h <= b.y ||
    b.y + b.h <= a.y
  );
}

/* Touching rule */
function touch(c0, p) {
  if (
    c0.x == 0 || c0.y == 0 ||
    c0.x + c0.w == S.mw ||
    c0.y + c0.h == S.mh
  ) return true;

  for (let r of p) {
    let th =
      Math.abs(c0.x + c0.w - r.x) < 1e-6 ||
      Math.abs(r.x + r.w - c0.x) < 1e-6;
    let tv =
      Math.abs(c0.y + c0.h - r.y) < 1e-6 ||
      Math.abs(r.y + r.h - c0.y) < 1e-6;
    let ovh = !(c0.y + c0.h <= r.y || r.y + r.h <= c0.y);
    let ovv = !(c0.x + c0.w <= r.x || r.x + r.w <= c0.x);
    if ((th && ovh) || (tv && ovv)) return true;
  }
  return false;
}

/* Corner radii for inner rects (only if touching outer corners) */
function cornerR(r) {
  return {
    tl: (r.x == 0 && r.y == 0) ? S.cr : 0,
    tr: (r.x + r.w == S.mw && r.y == 0) ? S.cr : 0,
    br: (r.x + r.w == S.mw && r.y + r.h == S.mh) ? S.cr : 0,
    bl: (r.x == 0 && r.y + r.h == S.mh) ? S.cr : 0
  };
}

/* Auto layout */
function layout() {
  let P = [];
  for (let b of S.boxes) {
    let xs = [0], ys = [0];
    for (let p of P) { xs.push(p.x + p.w); ys.push(p.y + p.h); }
    xs.sort((a, b) => a - b);
    ys.sort((a, b) => a - b);
    let placed = null;
    outer: for (let y of ys) {
      if (y + b.h > S.mh) continue;
      for (let x0 of xs) {
        if (x0 + b.w > S.mw) continue;
        let c0 = { x: x0, y: y, w: b.w, h: b.h, type: b.type };
        if (P.some(p => ov(c0, p))) continue;
        if (!touch(c0, P)) continue;
        placed = c0;
        break outer;
      }
    }
    if (placed) {
      if (b.type === "rect") {
        placed.r = cornerR(placed);
      }
      P.push(placed);
    }
  }
  S.placed = P;
}
document.getElementById("lay").onclick = () => { layout(); dr(); };

/* Drawing helpers */
function drawOuterProfile(ctx) {
  ctx.strokeStyle = "#d6d600";
  ctx.lineWidth = 2;
  if (S.profileType === "rect") {
    const pr = S.profileR;
    rc(ctx, 0, 0, mm(S.mw), mm(S.mh), {
      tl: mm(pr.tl), tr: mm(pr.tr), br: mm(pr.br), bl: mm(pr.bl)
    });
    ctx.stroke();
  } else {
    const cx = mm(S.mw / 2);
    const cy = mm(S.mh / 2);
    const rx = mm(S.mw / 2);
    const ry = mm(S.mh / 2);
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function rr(ctx, x0, y0, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x0 + r, y0);
  ctx.lineTo(x0 + w - r, y0);
  ctx.quadraticCurveTo(x0 + w, y0, x0 + w, y0 + r);
  ctx.lineTo(x0 + w, y0 + h - r);
  ctx.quadraticCurveTo(x0 + w, y0 + h, x0 + w - r, y0 + h);
  ctx.lineTo(x0 + r, y0 + h);
  ctx.quadraticCurveTo(x0, y0 + h, x0, y0 + h - r);
  ctx.lineTo(x0, y0 + r);
  ctx.quadraticCurveTo(x0, y0, x0 + r, y0);
  ctx.closePath();
}

function rc(ctx, x0, y0, w, h, r) {
  let tl = r.tl, tr = r.tr, br = r.br, bl = r.bl;
  ctx.beginPath();
  ctx.moveTo(x0 + tl, y0);
  ctx.lineTo(x0 + w - tr, y0);
  if (tr) ctx.quadraticCurveTo(x0 + w, y0, x0 + w, y0 + tr); else ctx.lineTo(x0 + w, y0);
  ctx.lineTo(x0 + w, y0 + h - br);
  if (br) ctx.quadraticCurveTo(x0 + w, y0 + h, x0 + w - br, y0 + h); else ctx.lineTo(x0 + w, y0 + h);
  ctx.lineTo(x0 + bl, y0 + h);
  if (bl) ctx.quadraticCurveTo(x0, y0 + h, x0, y0 + h - bl); else ctx.lineTo(x0, y0 + h);
  ctx.lineTo(x0, y0 + tl);
  if (tl) ctx.quadraticCurveTo(x0, y0, x0 + tl, y0); else ctx.lineTo(x0, y0);
  ctx.closePath();
}

/* Draw a dashed cut line on canvas */
function drawDash(ctx, r, isSel) {
  const x0 = mm(r.x), y0 = mm(r.y);
  const len = mm(r.orient === "h" ? r.w : r.h);
  const cut = mm(r.cut), tie = mm(r.tie);
  ctx.save();
  ctx.strokeStyle = isSel ? "#00ffff" : "#d6d600";
  ctx.lineWidth = isSel ? 2 : 1.5;
  ctx.setLineDash([cut, tie]);
  ctx.beginPath();
  if (r.orient === "h") {
    ctx.moveTo(x0, y0);
    ctx.lineTo(x0 + len, y0);
  } else {
    ctx.moveTo(x0, y0);
    ctx.lineTo(x0, y0 + len);
  }
  ctx.stroke();
  ctx.setLineDash([]);
  // Selection handle: small crosshair at start point
  if (isSel) {
    ctx.strokeStyle = "#00ffff";
    ctx.lineWidth = 1;
    const s = 4;
    ctx.beginPath();
    ctx.moveTo(x0 - s, y0 - s); ctx.lineTo(x0 + s, y0 + s);
    ctx.moveTo(x0 + s, y0 - s); ctx.lineTo(x0 - s, y0 + s);
    ctx.stroke();
  }
  ctx.restore();
}

function dr() {
  x.clearRect(0, 0, c.width, c.height);
  let ox = S.pad, oy = S.pad;
  x.save();
  x.translate(ox, oy);

  drawOuterProfile(x);

  x.lineWidth = 1.5;
  x.fillStyle = "rgba(214,214,0,0.1)";
  x.strokeStyle = "#d6d600";

  S.placed.forEach((r, idx) => {
    const isSel = (idx === selectedIndex && S.mode === "manual");
    if (r.type === "dash") {
      drawDash(x, r, isSel);
    } else if (r.type === "rect") {
      rc(x, mm(r.x), mm(r.y), mm(r.w), mm(r.h), {
        tl: mm(r.r?.tl || 0),
        tr: mm(r.r?.tr || 0),
        br: mm(r.r?.br || 0),
        bl: mm(r.r?.bl || 0)
      });
      x.fill();
      x.stroke();
      if (isSel) {
        x.save();
        x.strokeStyle = "#00ffff";
        x.lineWidth = 2;
        x.stroke();
        x.restore();
      }
    } else {
      const cx = mm(r.x + r.w / 2);
      const cy = mm(r.y + r.h / 2);
      const rx = mm(r.w / 2);
      const ry = mm(r.h / 2);
      x.beginPath();
      x.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      x.fill();
      x.stroke();
      if (isSel) {
        x.save();
        x.strokeStyle = "#00ffff";
        x.lineWidth = 2;
        x.stroke();
        x.restore();
      }
    }
  });

  x.restore();
}

/* Hit testing for selection (manual mode) */
c.addEventListener("click", (e) => {
  if (S.mode !== "manual") return;
  const rect = c.getBoundingClientRect();
  const mx = e.clientX - rect.left - S.pad;
  const my = e.clientY - rect.top - S.pad;
  const gx = mx / S.scale;
  const gy = my / S.scale;

  let hit = -1;
  for (let i = S.placed.length - 1; i >= 0; i--) {
    const r = S.placed[i];
    if (r.type === "dash") {
      // Hit within 1.5mm of the line
      const tol = 1.5;
      if (r.orient === "h") {
        if (gx >= r.x - tol && gx <= r.x + r.w + tol && gy >= r.y - tol && gy <= r.y + tol) { hit = i; break; }
      } else {
        if (gx >= r.x - tol && gx <= r.x + tol && gy >= r.y - tol && gy <= r.y + r.h + tol) { hit = i; break; }
      }
    } else if (r.type === "rect") {
      if (gx >= r.x && gx <= r.x + r.w && gy >= r.y && gy <= r.y + r.h) {
        hit = i;
        break;
      }
    } else {
      const cx = r.x + r.w / 2;
      const cy = r.y + r.h / 2;
      const rx = r.w / 2;
      const ry = r.h / 2;
      const dx = gx - cx;
      const dy = gy - cy;
      const val = (dx * dx) / (rx * rx) + (dy * dy) / (ry * ry);
      if (val <= 1) {
        hit = i;
        break;
      }
    }
  }
  selectedIndex = hit;
  updateSelectedUI();
  dr();
});

/* Selected shape UI */
function updateSelectedUI() {
  if (selectedIndex < 0 || selectedIndex >= S.placed.length || S.mode !== "manual") {
    selType.textContent = "–";
    selX.value = "";
    selY.value = "";
    selW.value = "";
    selH.value = "";
    selD.value = "";
    selWLabel.style.display = "block";
    selHLabel.style.display = "block";
    selDLabel.style.display = "none";
    document.getElementById("selCornerPanel").style.display = "none";
    document.getElementById("selDashPanel").style.display = "none";
    return;
  }
  const r = S.placed[selectedIndex];
  selType.textContent = r.type;
  selX.value = r.x.toFixed(2);
  selY.value = r.y.toFixed(2);

  if (r.type === "dash") {
    selWLabel.style.display = "none";
    selHLabel.style.display = "none";
    selDLabel.style.display = "none";
    document.getElementById("selCornerPanel").style.display = "none";
    document.getElementById("selDashPanel").style.display = "block";
    document.getElementById("selDashLen").value = (r.orient === "h" ? r.w : r.h).toFixed(2);
    document.getElementById("selDashOrient").value = r.orient;
    document.getElementById("selDashCut").value = r.cut;
    document.getElementById("selDashTie").value = r.tie;
    return;
  }

  document.getElementById("selDashPanel").style.display = "none";

  if (r.type === "rect" || r.type === "oval") {
    selWLabel.style.display = "block";
    selHLabel.style.display = "block";
    selDLabel.style.display = "none";
    selW.value = r.w.toFixed(2);
    selH.value = r.h.toFixed(2);
  } else {
    selWLabel.style.display = "none";
    selHLabel.style.display = "none";
    selDLabel.style.display = "block";
    selD.value = r.w.toFixed(2);
  }

  // Corner radii panel — only for rect cut boxes
  const cornerPanel = document.getElementById("selCornerPanel");
  if (r.type === "rect") {
    cornerPanel.style.display = "block";
    const rv = r.r || { tl: 0, tr: 0, br: 0, bl: 0 };
    document.getElementById("selCrTL").value = rv.tl || 0;
    document.getElementById("selCrTR").value = rv.tr || 0;
    document.getElementById("selCrBR").value = rv.br || 0;
    document.getElementById("selCrBL").value = rv.bl || 0;
    document.getElementById("selCrAll").value = "";
  } else {
    cornerPanel.style.display = "none";
  }
}

/* Duplication / spacing from selected */
document.getElementById("dup").onclick = () => {
  if (selectedIndex < 0) return;
  const base = S.placed[selectedIndex];
  const h = parseFloat(spH.value) || 0;
  const v = parseFloat(spV.value) || 0;
  const n = parseInt(spN.value) || 0;
  for (let i = 1; i <= n; i++) {
    const copy = JSON.parse(JSON.stringify(base));
    copy.x = base.x + h * i;
    copy.y = base.y + v * i;
    S.placed.push(copy);
    S.boxes.push({
      type: copy.type,
      w: copy.w,
      h: copy.h,
      r: copy.r
    });
  }
  dr();
};

/* SVG export */
function buildSvg() {
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${S.mw}mm" height="${S.mh}mm" viewBox="0 0 ${S.mw} ${S.mh}">`;
  svg += `<g fill="none" stroke="black" stroke-width="0.2">`;

  if (S.profileType === "rect") {
    const pr = S.profileR;
    const tl=pr.tl, tr=pr.tr, br=pr.br, bl=pr.bl;
    let d = `M${tl} 0H${S.mw-tr}`;
    d += tr ? `Q${S.mw} 0 ${S.mw} ${tr}` : `L${S.mw} 0`;
    d += `V${S.mh-br}`;
    d += br ? `Q${S.mw} ${S.mh} ${S.mw-br} ${S.mh}` : `L${S.mw} ${S.mh}`;
    d += `H${bl}`;
    d += bl ? `Q0 ${S.mh} 0 ${S.mh-bl}` : `L0 ${S.mh}`;
    d += `V${tl}`;
    d += tl ? `Q0 0 ${tl} 0` : `L0 0`;
    d += "Z";
    svg += `<path d="${d}"/>`;
  } else {
    svg += `<ellipse cx="${S.mw/2}" cy="${S.mh/2}" rx="${S.mw/2}" ry="${S.mh/2}"/>`;
  }

  for (let r of S.placed) {
    if (r.type === "dash") {
      const x1 = r.x, y1 = r.y;
      const x2 = r.orient === "h" ? r.x + r.w : r.x;
      const y2 = r.orient === "v" ? r.y + r.h : r.y;
      svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-dasharray="${r.cut} ${r.tie}"/>`;
    } else if (r.type === "rect") {
      let x0=r.x, y0=r.y, w=r.w, h=r.h;
      let tl=r.r?.tl||0, tr=r.r?.tr||0, br=r.r?.br||0, bl=r.r?.bl||0;
      let d = `M${x0+tl} ${y0}H${x0+w-tr}`;
      d += tr ? `Q${x0+w} ${y0} ${x0+w} ${y0+tr}` : `L${x0+w} ${y0}`;
      d += `V${y0+h-br}`;
      d += br ? `Q${x0+w} ${y0+h} ${x0+w-br} ${y0+h}` : `L${x0+w} ${y0+h}`;
      d += `H${x0+bl}`;
      d += bl ? `Q${x0} ${y0+h} ${x0} ${y0+h-bl}` : `L${x0} ${y0+h}`;
      d += `V${y0+tl}`;
      d += tl ? `Q${x0} ${y0} ${x0+tl} ${y0}` : `L${x0} ${y0}`;
      d += "Z";
      svg += `<path d="${d}"/>`;
    } else {
      svg += `<ellipse cx="${r.x+r.w/2}" cy="${r.y+r.h/2}" rx="${r.w/2}" ry="${r.h/2}"/>`;
    }
  }
  svg += `</g></svg>`;
  lastSvg = svg;
  return svg;
}

document.getElementById("downloadSvg").onclick = () => {
  buildSvg();
  const blob = new Blob([lastSvg], { type: "image/svg+xml" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "cutter.svg";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

/* PDF export – hand-written, byte-accurate xref, proper PDF operators */
document.getElementById("downloadPdf").onclick = () => {
  const margin = 1.5;
  const mm2pt = 2.8346;
  const pageW = S.mw + margin * 2;
  const pageH = S.mh + margin * 2;
  const pW = pageW * mm2pt;
  const pH = pageH * mm2pt;
  const ox = margin * mm2pt;
  const oy = margin * mm2pt;
  const K = 0.5523;

  // PDF origin is bottom-left, Y increases upward.
  // Our layout has Y increasing downward (like canvas).
  // Flip: pdfY = pH - (oy + mm_y*mm2pt)  →  helper takes raw pt coords
  function fy(y) { return (pH - y).toFixed(3); }
  function fx(x) { return x.toFixed(3); }
  function coord(x, y) { return `${fx(x)} ${fy(y)}`; }

  const ops = [];
  ops.push('0.5 w');       // line width
  ops.push('0 0 0 RG');    // stroke black
  ops.push('[] 0 d');      // solid dash (reset)

  // Rounded rect using proper PDF cubic bezier (c operator: 3 control points)
  function rrPath(x, y, w, h, tl, tr, br, bl) {
    // corners: tl=top-left in our downward-Y space (y=top of rect)
    ops.push(`${coord(x+tl, y)} m`);
    ops.push(`${coord(x+w-tr, y)} l`);
    if (tr > 0) {
      ops.push(`${coord(x+w-tr*K*0, y)} ${coord(x+w, y+tr*K*0)} ${coord(x+w, y+tr)} c`);
      // simpler: quadratic via cubic: cp1=cp2=corner
      ops.pop();
      ops.push(`${coord(x+w, y)} ${coord(x+w, y)} ${coord(x+w, y+tr)} c`);
    } else { ops.push(`${coord(x+w, y)} l`); }
    ops.push(`${coord(x+w, y+h-br)} l`);
    if (br > 0) {
      ops.push(`${coord(x+w, y+h)} ${coord(x+w, y+h)} ${coord(x+w-br, y+h)} c`);
    } else { ops.push(`${coord(x+w, y+h)} l`); }
    ops.push(`${coord(x+bl, y+h)} l`);
    if (bl > 0) {
      ops.push(`${coord(x, y+h)} ${coord(x, y+h)} ${coord(x, y+h-bl)} c`);
    } else { ops.push(`${coord(x, y+h)} l`); }
    ops.push(`${coord(x, y+tl)} l`);
    if (tl > 0) {
      ops.push(`${coord(x, y)} ${coord(x, y)} ${coord(x+tl, y)} c`);
    } else { ops.push(`${coord(x, y)} l`); }
    ops.push('h S');
  }

  function ellPath(cx, cy, rx, ry) {
    const kx = rx*K, ky = ry*K;
    ops.push(`${coord(cx+rx, cy)} m`);
    ops.push(`${coord(cx+rx, cy-ky)} ${coord(cx+kx, cy-ry)} ${coord(cx, cy-ry)} c`);
    ops.push(`${coord(cx-kx, cy-ry)} ${coord(cx-rx, cy-ky)} ${coord(cx-rx, cy)} c`);
    ops.push(`${coord(cx-rx, cy+ky)} ${coord(cx-kx, cy+ry)} ${coord(cx, cy+ry)} c`);
    ops.push(`${coord(cx+kx, cy+ry)} ${coord(cx+rx, cy+ky)} ${coord(cx+rx, cy)} c`);
    ops.push('h S');
  }

  // Outer profile
  if (S.profileType === "rect") {
    const pr = S.profileR;
    rrPath(ox, oy, S.mw*mm2pt, S.mh*mm2pt,
      pr.tl*mm2pt, pr.tr*mm2pt, pr.br*mm2pt, pr.bl*mm2pt);
  } else {
    ellPath(ox+S.mw/2*mm2pt, oy+S.mh/2*mm2pt, S.mw/2*mm2pt, S.mh/2*mm2pt);
  }

  // Inner shapes
  for (const r of S.placed) {
    const rx = ox + r.x*mm2pt;
    const ry = oy + r.y*mm2pt;
    const rw = r.w*mm2pt;
    const rh = r.h*mm2pt;

    if (r.type === "dash") {
      const cut = (r.cut*mm2pt).toFixed(3);
      const tie = (r.tie*mm2pt).toFixed(3);
      ops.push(`[${cut} ${tie}] 0 d`);
      if (r.orient === "h") {
        ops.push(`${coord(rx, ry)} m`);
        ops.push(`${coord(rx+rw, ry)} l S`);
      } else {
        ops.push(`${coord(rx, ry)} m`);
        ops.push(`${coord(rx, ry+rh)} l S`);
      }
      ops.push('[] 0 d');
    } else if (r.type === "rect") {
      const tl=(r.r?.tl||0)*mm2pt, tr=(r.r?.tr||0)*mm2pt;
      const br=(r.r?.br||0)*mm2pt, bl=(r.r?.bl||0)*mm2pt;
      rrPath(rx, ry, rw, rh, tl, tr, br, bl);
    } else {
      ellPath(rx+rw/2, ry+rh/2, rw/2, rh/2);
    }
  }

  // Build PDF with byte-accurate xref
  const enc = new TextEncoder();
  const streamBytes = enc.encode(ops.join('\n'));
  const streamLen = streamBytes.length;

  function obj(n, dict, streamData) {
    let s = `${n} 0 obj\n${dict}\n`;
    if (streamData) s += `stream\n${streamData}\nendstream\n`;
    s += 'endobj\n';
    return s;
  }

  const o1 = obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  const o2 = obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  const o3 = obj(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pW.toFixed(3)} ${pH.toFixed(3)}] /Contents 4 0 R /Resources << >> >>`);
  const o4 = obj(4, `<< /Length ${streamLen} >>`, ops.join('\n'));

  const header = '%PDF-1.4\n';
  let pos = enc.encode(header).length;
  const offsets = [0];
  [o1,o2,o3,o4].forEach(o => { offsets.push(pos); pos += enc.encode(o).length; });

  let xref = `xref\n0 5\n0000000000 65535 f \n`;
  for (let i = 1; i <= 4; i++) xref += offsets[i].toString().padStart(10,'0') + ' 00000 n \n';
  const trailer = `trailer\n<< /Size 5 /Root 1 0 R >>\nstartxref\n${pos}\n%%EOF`;

  const pdfStr = header + o1 + o2 + o3 + o4 + xref + trailer;
  const blob = new Blob([pdfStr], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'cutter.pdf';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};


/* ── Annotated PDF export ── */
document.getElementById("downloadPdfAnnotated").onclick = () => {
  const mm2pt = 2.8346;
  const K = 0.5523;

  // Page: generous margin for outer dim lines, no table needed
  const annMar = 16;
  const pageW   = S.mw + annMar * 2;
  const pageH   = S.mh + annMar * 2;
  const pW = pageW * mm2pt;
  const pH = pageH * mm2pt;
  const ox = annMar * mm2pt;   // profile left edge in pt
  const oy = annMar * mm2pt;   // profile bottom edge in pt (PDF Y up)

  // Profile right/top in pt
  const pr = ox + S.mw * mm2pt;
  const pt_ = oy + S.mh * mm2pt;

  function p2(x, y) { return x.toFixed(3) + ' ' + (pH - y).toFixed(3); }

  const ops = [];
  ops.push('0 0 0 RG 0 0 0 rg');

  // Colour scheme (PDF RGB)
  const COL_OUTER = '0.05 0.30 0.70';  // blue  – outer profile dims
  const COL_INNER = '0.00 0.50 0.20';  // green – inner cut dims
  const COL_GAP   = '0.80 0.35 0.00';  // orange – gap dims

  function setCol(c) { ops.push(c+' RG '+c+' rg'); }

  function drawLine(x1,y1,x2,y2,lw) {
    if(lw) ops.push(lw+' w');
    ops.push(p2(x1,y1)+' m '+p2(x2,y2)+' l S');
  }

  function arrowHead(tx,ty,dx,dy) {
    const len=1.8*mm2pt, w=0.6*mm2pt;
    const bx=tx-dx*len, by=ty-dy*len, px=-dy, py=dx;
    ops.push(p2(tx,ty)+' m '+p2(bx+px*w,by+py*w)+' l '+p2(bx-px*w,by-py*w)+' l f');
  }

  function textAt(str, x, y, sz, align) {
    const safe = str.replace(/\(/g,'\\(').replace(/\)/g,'\\)');
    const aw = safe.length * sz * 0.52;
    let tx = align==='c' ? x-aw/2 : align==='r' ? x-aw : x;
    ops.push('BT /F1 '+sz+' Tf '+tx.toFixed(3)+' '+(pH-y-sz*0.35).toFixed(3)+' Td ('+safe+') Tj ET');
  }

  function textRot(str, x, y, sz) {
    const safe = str.replace(/\(/g,'\\(').replace(/\)/g,'\\)');
    const aw = safe.length * sz * 0.52;
    ops.push('BT /F1 '+sz+' Tf 0 1 -1 0 '+x.toFixed(3)+' '+(pH-y+aw/2).toFixed(3)+' Tm ('+safe+') Tj ET');
  }

  function fmt(v) { return (v%1===0 ? v.toString() : v.toFixed(2))+'mm'; }

  // ── Dimension line helpers ──
  // Horizontal dim: spans x1→x2, dim line sits at y (going downward = lower y in our coords)
  function hDim(x1, x2, y, label, sz) {
    const s = sz||7;
    const tick = 3*mm2pt;
    const mid = (x1+x2)/2;
    ops.push('0.25 w [1.5 1.5] 0 d');
    drawLine(x1, y+tick*0.3, x1, y-tick);   // tick left
    drawLine(x2, y+tick*0.3, x2, y-tick);   // tick right
    ops.push('[] 0 d');
    drawLine(x1, y-tick*0.5, x2, y-tick*0.5);  // dim line
    arrowHead(x1, y-tick*0.5, 1, 0);
    arrowHead(x2, y-tick*0.5, -1, 0);
    textAt(label, mid, y-tick*0.5+1.8*mm2pt, s, 'c');
  }

  // Vertical dim: spans y1→y2, dim line sits at x (going left = lower x)
  function vDim(y1, y2, x, label, sz) {
    const s = sz||7;
    const tick = 3*mm2pt;
    const mid = (y1+y2)/2;
    ops.push('0.25 w [1.5 1.5] 0 d');
    drawLine(x+tick*0.3, y1, x-tick, y1);
    drawLine(x+tick*0.3, y2, x-tick, y2);
    ops.push('[] 0 d');
    drawLine(x-tick*0.5, y1, x-tick*0.5, y2);
    arrowHead(x-tick*0.5, y1, 0, 1);
    arrowHead(x-tick*0.5, y2, 0, -1);
    textRot(label, x-tick*0.5-2*mm2pt, mid, s);
  }

  // Small inline gap dim — drawn INSIDE the gap space between two edges
  // Horizontal gap between right edge x1 and left edge x2, centred at midY
  function hGap(x1, x2, midY, label) {
    if (x2-x1 < 0.3*mm2pt) return;
    const mid = (x1+x2)/2;
    const tick = 1.8*mm2pt;
    ops.push('0.2 w [] 0 d');
    drawLine(x1, midY-tick/2, x1, midY+tick/2);  // left tick
    drawLine(x2, midY-tick/2, x2, midY+tick/2);  // right tick
    drawLine(x1, midY, x2, midY);                 // span line
    arrowHead(x1, midY, 1, 0);
    arrowHead(x2, midY, -1, 0);
    textAt(label, mid, midY+1.5*mm2pt, 5.5, 'c');
  }

  // Vertical gap between bottom edge y1 and top edge y2, centred at midX
  function vGap(y1, y2, midX, label) {
    if (y2-y1 < 0.3*mm2pt) return;
    const mid = (y1+y2)/2;
    const tick = 1.8*mm2pt;
    ops.push('0.2 w [] 0 d');
    drawLine(midX-tick/2, y1, midX+tick/2, y1);
    drawLine(midX-tick/2, y2, midX+tick/2, y2);
    drawLine(midX, y1, midX, y2);
    arrowHead(midX, y1, 0, 1);
    arrowHead(midX, y2, 0, -1);
    textRot(label, midX+1.5*mm2pt, mid, 5.5);
  }

  // ── Shape drawing ──
  function roundRectPath(x,y,w,h,tl,tr,br,bl) {
    ops.push(p2(x+tl,y)+' m');
    ops.push(p2(x+w-tr,y)+' l');
    if(tr>0) ops.push(p2(x+w,y)+' '+p2(x+w,y)+' '+p2(x+w,y+tr)+' c');
    else ops.push(p2(x+w,y)+' l');
    ops.push(p2(x+w,y+h-br)+' l');
    if(br>0) ops.push(p2(x+w,y+h)+' '+p2(x+w,y+h)+' '+p2(x+w-br,y+h)+' c');
    else ops.push(p2(x+w,y+h)+' l');
    ops.push(p2(x+bl,y+h)+' l');
    if(bl>0) ops.push(p2(x,y+h)+' '+p2(x,y+h)+' '+p2(x,y+h-bl)+' c');
    else ops.push(p2(x,y+h)+' l');
    ops.push(p2(x,y+tl)+' l');
    if(tl>0) ops.push(p2(x,y)+' '+p2(x,y)+' '+p2(x+tl,y)+' c');
    else ops.push(p2(x,y)+' l');
    ops.push('h S');
  }

  function ellipsePath(cx,cy,rx,ry) {
    const kx=rx*K, ky=ry*K;
    ops.push(p2(cx+rx,cy)+' m');
    ops.push(p2(cx+rx,cy-ky)+' '+p2(cx+kx,cy-ry)+' '+p2(cx,cy-ry)+' c');
    ops.push(p2(cx-kx,cy-ry)+' '+p2(cx-rx,cy-ky)+' '+p2(cx-rx,cy)+' c');
    ops.push(p2(cx-rx,cy+ky)+' '+p2(cx-kx,cy+ry)+' '+p2(cx,cy+ry)+' c');
    ops.push(p2(cx+kx,cy+ry)+' '+p2(cx+rx,cy+ky)+' '+p2(cx+rx,cy)+' c');
    ops.push('h S');
  }

  // ── 1. Draw outer profile ── [BLACK]
  ops.push('0 0 0 RG 0 0 0 rg');
  ops.push('0.6 w');
  if (S.profileType==="rect") {
    const pr=S.profileR;
    roundRectPath(ox,oy,S.mw*mm2pt,S.mh*mm2pt,pr.tl*mm2pt,pr.tr*mm2pt,pr.br*mm2pt,pr.bl*mm2pt);
  } else {
    ellipsePath(ox+S.mw/2*mm2pt, oy+S.mh/2*mm2pt, S.mw/2*mm2pt, S.mh/2*mm2pt);
  }

  // ── 2. Draw inner shapes ──
  ops.push('0.4 w');
  for (const r of S.placed) {
    const rx=ox+r.x*mm2pt, ry=oy+r.y*mm2pt, rw=r.w*mm2pt, rh=r.h*mm2pt;
    if (r.type==="dash") {
      const cut=r.cut*mm2pt, tie=r.tie*mm2pt;
      ops.push(`[${cut.toFixed(3)} ${tie.toFixed(3)}] 0 d`);
      if (r.orient==="h") {
        ops.push(p2(rx,ry)+' m');
        ops.push(p2(rx+rw,ry)+' l S');
      } else {
        ops.push(p2(rx,ry)+' m');
        ops.push(p2(rx,ry+rh)+' l S');
      }
      ops.push('[] 0 d');
    } else if (r.type==="rect") {
      roundRectPath(rx,ry,rw,rh,(r.r?.tl||0)*mm2pt,(r.r?.tr||0)*mm2pt,(r.r?.br||0)*mm2pt,(r.r?.bl||0)*mm2pt);
    } else {
      ellipsePath(rx+rw/2, ry+rh/2, rw/2, rh/2);
    }
  }

  // ── 3. Outer profile dimension lines ── [BLUE]
  setCol(COL_OUTER);
  // Width: below profile
  hDim(ox, pr, oy - 6*mm2pt, fmt(S.mw), 8);
  // Height: left of profile
  vDim(oy, pt_, ox - 6*mm2pt, fmt(S.mh), 8);
  // Corner radius callout for rect
  if (S.profileType==="rect") {
    const pr=S.profileR;
    const corners = [
      { label:'TL', v:pr.tl, px:ox, py:oy },
      { label:'TR', v:pr.tr, px:ox+S.mw*mm2pt, py:oy },
      { label:'BR', v:pr.br, px:ox+S.mw*mm2pt, py:oy+S.mh*mm2pt },
      { label:'BL', v:pr.bl, px:ox, py:oy+S.mh*mm2pt },
    ];
    const allSame = pr.tl===pr.tr && pr.tr===pr.br && pr.br===pr.bl;
    if (allSame && pr.tl>0) {
      const crPt=pr.tl*mm2pt;
      ops.push('[] 0 d 0.2 w');
      const lx=ox-4*mm2pt, ly=oy+crPt*1.5;
      drawLine(ox+crPt*0.5, oy+crPt*0.5, lx, ly);
      textAt('R'+pr.tl+'mm', lx-1*mm2pt, ly+1*mm2pt, 6, 'r');
    } else {
      corners.forEach(({label,v,px,py})=>{
        if(v<=0) return;
        const crPt=v*mm2pt;
        ops.push('[] 0 d 0.2 w');
        // leader line from corner inward
        const dx = px===ox ? 1 : -1;
        const dy = py===oy ? 1 : -1;
        const lx=px+dx*5*mm2pt, ly=py+dy*5*mm2pt;
        drawLine(px+dx*crPt*0.5, py+dy*crPt*0.5, lx, ly);
        textAt(label+' R'+v+'mm', lx+dx*1*mm2pt, ly, 5, dx>0?'l':'r');
      });
    }
  }

  // ── 4. Inner shape size dims ── [GREEN]
  setCol(COL_INNER);
  for (const r of S.placed) {
    const rx=ox+r.x*mm2pt, ry=oy+r.y*mm2pt, rw=r.w*mm2pt, rh=r.h*mm2pt;
    const cx=rx+rw/2, cy=ry+rh/2;

    if (r.type==="dash") {
      // Label: length above/beside line, plus cut/tie callout
      ops.push('0.2 w [] 0 d');
      const len = r.orient==="h" ? r.w : r.h;
      if (r.orient==="h") {
        arrowHead(rx, ry, 1, 0); arrowHead(rx+rw, ry, -1, 0);
        drawLine(rx, ry, rx+rw, ry);
        textAt(fmt(len), cx, ry - 2*mm2pt, 6, 'c');
        textAt(`cut ${fmt(r.cut)} / tie ${fmt(r.tie)}`, cx, ry - 4.5*mm2pt, 5, 'c');
      } else {
        arrowHead(rx, ry, 0, 1); arrowHead(rx, ry+rh, 0, -1);
        drawLine(rx, ry, rx, ry+rh);
        textAt(fmt(len), rx - 2*mm2pt, cy, 6, 'r');
        textAt(`cut ${fmt(r.cut)} / tie ${fmt(r.tie)}`, rx - 2*mm2pt, cy + 3*mm2pt, 5, 'r');
      }
    } else if (r.type==="rect" || r.type==="oval") {
      // Width dim inside shape near bottom edge
      hDim(rx, rx+rw, ry + 5*mm2pt, fmt(r.w), 6);
      // Height dim inside shape near right edge
      vDim(ry, ry+rh, rx+rw - 5*mm2pt, fmt(r.h), 6);
    } else {
      // Circle/oval: horizontal diameter
      ops.push('0.2 w [] 0 d');
      drawLine(rx, cy, rx+rw, cy);
      arrowHead(rx, cy, 1, 0); arrowHead(rx+rw, cy, -1, 0);
      textAt(fmt(r.w), cx, cy+1.8*mm2pt, 6.5, 'c');
      if (r.h !== r.w) {
        drawLine(cx, ry, cx, ry+rh);
        arrowHead(cx, ry, 0, 1); arrowHead(cx, ry+rh, 0, -1);
        textAt(fmt(r.h), cx+2*mm2pt, cy, 6.5, 'l');
      }
    }
  }

  // ── 5. Gap dims ── [ORANGE]
  setCol(COL_GAP);
  const placed = S.placed;
  const boxes = placed.map(r => ({
    x1:r.x, y1:r.y, x2:r.x+r.w, y2:r.y+r.h,
    cx:r.x+r.w/2, cy:r.y+r.h/2
  }));

  const drawnH = new Set();
  const drawnV = new Set();

  // Between every pair of shapes
  for (let i=0; i<boxes.length; i++) {
    for (let j=i+1; j<boxes.length; j++) {
      const a=boxes[i], b=boxes[j];

      // Horizontal gap: a is left of b
      const left  = a.x2 <= b.x1+0.01 ? a : (b.x2 <= a.x1+0.01 ? b : null);
      const right = left===a ? b : left===b ? a : null;
      if (left && right && right.x1 >= left.x2-0.01) {
        const oy1=Math.max(left.y1,right.y1), oy2=Math.min(left.y2,right.y2);
        if (oy2 > oy1+0.01) {
          const gap=right.x1-left.x2;
          const key=left.x2.toFixed(2)+'|'+right.x1.toFixed(2);
          if (!drawnH.has(key) && gap>0.05) {
            // Check nothing sits in between
            const blocked=boxes.some((c,k)=>k!==i&&k!==j&&c.x1<right.x1-0.01&&c.x2>left.x2+0.01&&c.y1<oy2&&c.y2>oy1);
            if (!blocked) {
              drawnH.add(key);
              const midY=oy+((oy1+oy2)/2)*mm2pt;
              hGap(ox+left.x2*mm2pt, ox+right.x1*mm2pt, midY, fmt(gap));
            }
          }
        }
      }

      // Vertical gap: a is above b (remember PDF: lower y1 = higher on page)
      const top    = a.y2 <= b.y1+0.01 ? a : (b.y2 <= a.y1+0.01 ? b : null);
      const bottom = top===a ? b : top===b ? a : null;
      if (top && bottom && bottom.y1 >= top.y2-0.01) {
        const ox1=Math.max(top.x1,bottom.x1), ox2=Math.min(top.x2,bottom.x2);
        if (ox2 > ox1+0.01) {
          const gap=bottom.y1-top.y2;
          const key=top.y2.toFixed(2)+'|'+bottom.y1.toFixed(2);
          if (!drawnV.has(key) && gap>0.05) {
            const blocked=boxes.some((c,k)=>k!==i&&k!==j&&c.y1<bottom.y1-0.01&&c.y2>top.y2+0.01&&c.x1<ox2&&c.x2>ox1);
            if (!blocked) {
              drawnV.add(key);
              const midX=ox+((ox1+ox2)/2)*mm2pt;
              vGap(oy+top.y2*mm2pt, oy+bottom.y1*mm2pt, midX, fmt(gap));
            }
          }
        }
      }
    }

    // Gap from each shape to the outer profile edges
    const a=boxes[i];
    const aMidX=oy+(a.x1+a.x2)/2*mm2pt;
    const aMidY=oy+(a.y1+a.y2)/2*mm2pt;

    // Left edge gap
    if (!boxes.some((b,j)=>j!==i&&b.x2<=a.x1+0.01&&b.y1<a.y2&&b.y2>a.y1) && a.x1>0.1) {
      const key='L'+i;
      if (!drawnH.has(key)) { drawnH.add(key);
        hGap(ox, ox+a.x1*mm2pt, oy+(a.y1+a.y2)/2*mm2pt, fmt(a.x1)); }
    }
    // Right edge gap
    if (!boxes.some((b,j)=>j!==i&&b.x1>=a.x2-0.01&&b.y1<a.y2&&b.y2>a.y1) && S.mw-a.x2>0.1) {
      const key='R'+i;
      if (!drawnH.has(key)) { drawnH.add(key);
        hGap(ox+a.x2*mm2pt, pr, oy+(a.y1+a.y2)/2*mm2pt, fmt(S.mw-a.x2)); }
    }
    // Top edge gap
    if (!boxes.some((b,j)=>j!==i&&b.y2<=a.y1+0.01&&b.x1<a.x2&&b.x2>a.x1) && a.y1>0.1) {
      const key='T'+i;
      if (!drawnV.has(key)) { drawnV.add(key);
        vGap(oy, oy+a.y1*mm2pt, ox+(a.x1+a.x2)/2*mm2pt, fmt(a.y1)); }
    }
    // Bottom edge gap
    if (!boxes.some((b,j)=>j!==i&&b.y1>=a.y2-0.01&&b.x1<a.x2&&b.x2>a.x1) && S.mh-a.y2>0.1) {
      const key='B'+i;
      if (!drawnV.has(key)) { drawnV.add(key);
        vGap(oy+a.y2*mm2pt, pt_, ox+(a.x1+a.x2)/2*mm2pt, fmt(S.mh-a.y2)); }
    }
  }

  // ── Build PDF ──
  const stream = ops.join('\n');
  const enc = new TextEncoder();
  const streamLen = enc.encode(stream).length;

  const header = '%PDF-1.4\n';
  const s1 = '1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n';
  const s2 = '2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n';
  const s3 = '3 0 obj\n<< /Type /Page /Parent 2 0 R '
    +'/MediaBox [0 0 '+pW.toFixed(3)+' '+pH.toFixed(3)+'] '
    +'/Contents 4 0 R '
    +'/Resources << /Font << /F1 5 0 R >> >> >>\nendobj\n';
  const s4 = '4 0 obj\n<< /Length '+streamLen+' >>\nstream\n'+stream+'\nendstream\nendobj\n';
  const s5 = '5 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica '
    +'/Encoding /WinAnsiEncoding >>\nendobj\n';

  let pos = enc.encode(header).length;
  const o1off = pos; pos += enc.encode(s1).length;
  const o2off = pos; pos += enc.encode(s2).length;
  const o3off = pos; pos += enc.encode(s3).length;
  const o4off = pos; pos += enc.encode(s4).length;
  const o5off = pos; pos += enc.encode(s5).length;
  const xrefOff = pos;

  let pdfStr = header + s1 + s2 + s3 + s4 + s5;
  pdfStr += 'xref\n0 6\n0000000000 65535 f \n';
  [o1off,o2off,o3off,o4off,o5off].forEach(off => {
    pdfStr += off.toString().padStart(10,'0')+' 00000 n \n';
  });
  pdfStr += 'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xrefOff+'\n%%EOF';

  const blob = new Blob([pdfStr], {type:'application/pdf'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='cutter-annotated.pdf';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

setMode("auto");
rs();
</script>
</body>
</html>
